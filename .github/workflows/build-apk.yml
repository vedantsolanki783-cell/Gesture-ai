name: Build NOVA Jarvis Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java 21 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Install Dependencies & Build NOVA Web Core
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 5. Initialize Native Android Project (Capacitor)
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-save --legacy-peer-deps
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nova.jarvis",
            "appName": "NOVA Jarvis AI",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": true
            },
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: 6. Create Ultron Accessibility Service XML Config
        run: |
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/ultron_accessibility.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

      - name: 7. Create UltronAccessibilityService.java
        run: |
          mkdir -p android/app/src/main/java/com/nova/jarvis
          cat << 'EOF' > android/app/src/main/java/com/nova/jarvis/UltronAccessibilityService.java
          package com.nova.jarvis;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.os.Build;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.Toast;

          public class UltronAccessibilityService extends AccessibilityService {
              private static UltronAccessibilityService instance;

              public static UltronAccessibilityService getInstance() {
                  return instance;
              }

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
                  Toast.makeText(this, "NOVA Ultron Autonomous Control Online", Toast.LENGTH_SHORT).show();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {}

              @Override
              public void onInterrupt() {}

              @Override
              public void onDestroy() {
                  instance = null;
                  super.onDestroy();
              }

              public boolean tapPoint(float x, float y) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return false;
                  Path path = new Path();
                  path.moveTo(x, y);
                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  builder.addStroke(new GestureDescription.StrokeDescription(path, 0, 80));
                  return dispatchGesture(builder.build(), null, null);
              }

              public boolean swipePath(float x1, float y1, float x2, float y2, long durationMs) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return false;
                  Path path = new Path();
                  path.moveTo(x1, y1);
                  path.lineTo(x2, y2);
                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  builder.addStroke(new GestureDescription.StrokeDescription(path, 0, Math.max(120, durationMs)));
                  return dispatchGesture(builder.build(), null, null);
              }

              public boolean runGlobal(String cmd) {
                  if (cmd == null) return false;
                  String c = cmd.toUpperCase().trim();
                  switch (c) {
                      case "HOME":
                          return performGlobalAction(GLOBAL_ACTION_HOME);
                      case "BACK":
                          return performGlobalAction(GLOBAL_ACTION_BACK);
                      case "RECENTS":
                          return performGlobalAction(GLOBAL_ACTION_RECENTS);
                      case "NOTIFICATIONS":
                          return performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS);
                      case "QUICK_SETTINGS":
                          return performGlobalAction(GLOBAL_ACTION_QUICK_SETTINGS);
                      case "SCREENSHOT":
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                              return performGlobalAction(GLOBAL_ACTION_TAKE_SCREENSHOT);
                          }
                          return false;
                      default:
                          return false;
                  }
              }
          }
          EOF

      - name: 8. Create Interactive JarvisOverlayService.java (Floating Arc-Reactor + Mini Command HUD)
        run: |
          cat << 'EOF' > android/app/src/main/java/com/nova/jarvis/JarvisOverlayService.java
          package com.nova.jarvis;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.core.app.NotificationCompat;

          public class JarvisOverlayService extends Service {
              private static final String CHANNEL_ID = "nova_jarvis_bg_channel";
              private WindowManager windowManager;
              private LinearLayout rootContainer;
              private TextView reactorBubble;
              private LinearLayout hudPanel;
              private WindowManager.LayoutParams params;
              private boolean isExpanded = false;

              @Override
              public void onCreate() {
                  super.onCreate();
                  startJarvisForegroundNotification();
                  showFloatingReactorHud();
              }

              private void startJarvisForegroundNotification() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel chan = new NotificationChannel(
                          CHANNEL_ID,
                          "NOVA Jarvis Background Core",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(chan);
                  }
                  Intent openIntent = new Intent(this, MainActivity.class);
                  openIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pi = PendingIntent.getActivity(
                      this, 0, openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  Notification notif = new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("NOVA Jarvis + Ultron Active")
                      .setContentText("Floating HUD running in background. Tap to open NOVA.")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build();

                  startForeground(1337, notif);
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private TextView createHudButton(String label, String bgColor, View.OnClickListener listener) {
                  TextView btn = new TextView(this);
                  btn.setText(label);
                  btn.setTextColor(Color.WHITE);
                  btn.setTextSize(12f);
                  btn.setGravity(Gravity.CENTER);
                  btn.setPadding(dp(10), dp(8), dp(10), dp(8));

                  GradientDrawable bg = new GradientDrawable();
                  bg.setCornerRadius(dp(8));
                  bg.setColor(Color.parseColor(bgColor));
                  bg.setStroke(dp(1), Color.parseColor("#38bdf8"));
                  btn.setBackground(bg);

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  lp.setMargins(dp(4), dp(4), dp(4), dp(4));
                  btn.setLayoutParams(lp);
                  btn.setOnClickListener(listener);
                  return btn;
              }

              private void triggerUltronAction(String action) {
                  UltronAccessibilityService svc = UltronAccessibilityService.getInstance();
                  if (svc == null) {
                      Toast.makeText(this, "Turn ON 'NOVA Ultron Agent Control' in Accessibility Settings!", Toast.LENGTH_LONG).show();
                      Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                      return;
                  }
                  if ("SWIPE_UP".equals(action)) {
                      svc.swipePath(500, 1400, 500, 350, 300);
                  } else if ("SWIPE_DOWN".equals(action)) {
                      svc.swipePath(500, 350, 500, 1400, 300);
                  } else {
                      svc.runGlobal(action);
                  }
              }

              private void showFloatingReactorHud() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      return;
                  }
                  if (rootContainer != null) return;

                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  rootContainer = new LinearLayout(this);
                  rootContainer.setOrientation(LinearLayout.HORIZONTAL);
                  rootContainer.setGravity(Gravity.CENTER_VERTICAL);

                  // 1. Glowing Arc-Reactor Bubble
                  reactorBubble = new TextView(this);
                  reactorBubble.setText("⚡");
                  reactorBubble.setTextSize(22f);
                  reactorBubble.setTextColor(Color.parseColor("#38bdf8"));
                  reactorBubble.setGravity(Gravity.CENTER);
                  reactorBubble.setLayoutParams(new LinearLayout.LayoutParams(dp(58), dp(58)));

                  GradientDrawable shape = new GradientDrawable();
                  shape.setShape(GradientDrawable.OVAL);
                  shape.setColor(Color.parseColor("#EE090D16"));
                  shape.setStroke(dp(3), Color.parseColor("#38bdf8"));
                  reactorBubble.setBackground(shape);

                  // 2. Expandable Floating Jarvis Command Panel
                  hudPanel = new LinearLayout(this);
                  hudPanel.setOrientation(LinearLayout.VERTICAL);
                  hudPanel.setPadding(dp(10), dp(8), dp(10), dp(8));
                  hudPanel.setVisibility(View.GONE);

                  GradientDrawable panelBg = new GradientDrawable();
                  panelBg.setCornerRadius(dp(14));
                  panelBg.setColor(Color.parseColor("#F2090D16"));
                  panelBg.setStroke(dp(2), Color.parseColor("#38bdf8"));
                  hudPanel.setBackground(panelBg);

                  LinearLayout.LayoutParams panelLp = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  panelLp.setMargins(dp(8), 0, 0, 0);
                  hudPanel.setLayoutParams(panelLp);

                  // Row 1: Navigation & System Actions
                  LinearLayout row1 = new LinearLayout(this);
                  row1.setOrientation(LinearLayout.HORIZONTAL);
                  row1.addView(createHudButton("🏠 Home", "#1e293b", v -> triggerUltronAction("HOME")));
                  row1.addView(createHudButton("🔙 Back", "#1e293b", v -> triggerUltronAction("BACK")));
                  row1.addView(createHudButton("🗂️️ Apps", "#1e293b", v -> triggerUltronAction("RECENTS")));
                  row1.addView(createHudButton("📸 Shot", "#0284c7", v -> triggerUltronAction("SCREENSHOT")));

                  // Row 2: Scroll & Open Full NOVA App
                  LinearLayout row2 = new LinearLayout(this);
                  row2.setOrientation(LinearLayout.HORIZONTAL);
                  row2.addView(createHudButton("⬆️ Scroll", "#1e293b", v -> triggerUltronAction("SWIPE_UP")));
                  row2.addView(createHudButton("⬇️ Scroll", "#1e293b", v -> triggerUltronAction("SWIPE_DOWN")));
                  row2.addView(createHudButton("🤖 Open NOVA", "#10b981", v -> {
                      toggleHud(false);
                      Intent i = new Intent(JarvisOverlayService.this, MainActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      startActivity(i);
                  }));
                  row2.addView(createHudButton("✕", "#ef4444", v -> toggleHud(false)));

                  hudPanel.addView(row1);
                  hudPanel.addView(row2);

                  rootContainer.addView(reactorBubble);
                  rootContainer.addView(hudPanel);

                  int layoutType = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      : WindowManager.LayoutParams.TYPE_PHONE;

                  params = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  );
                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = 24;
                  params.y = 240;

                  reactorBubble.setOnTouchListener(new View.OnTouchListener() {
                      private int initX, initY;
                      private float touchX, touchY;
                      private long downTime;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  initX = params.x;
                                  initY = params.y;
                                  touchX = event.getRawX();
                                  touchY = event.getRawY();
                                  downTime = System.currentTimeMillis();
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  params.x = initX + (int) (event.getRawX() - touchX);
                                  params.y = initY + (int) (event.getRawY() - touchY);
                                  if (windowManager != null && rootContainer != null) {
                                      windowManager.updateViewLayout(rootContainer, params);
                                  }
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  long elapsed = System.currentTimeMillis() - downTime;
                                  float moved = (float) Math.hypot(event.getRawX() - touchX, event.getRawY() - touchY);
                                  if (moved < 18 && elapsed < 400) {
                                      // Tap: Toggle the interactive Jarvis Mini-HUD right on screen!
                                      toggleHud(!isExpanded);
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });

                  if (windowManager != null) {
                      windowManager.addView(rootContainer, params);
                  }
              }

              private void toggleHud(boolean expand) {
                  isExpanded = expand;
                  if (hudPanel != null) {
                      hudPanel.setVisibility(expand ? View.VISIBLE : View.GONE);
                      if (windowManager != null && rootContainer != null) {
                          windowManager.updateViewLayout(rootContainer, params);
                      }
                  }
              }

              private void removeBubble() {
                  if (windowManager != null && rootContainer != null) {
                      try { windowManager.removeView(rootContainer); } catch (Exception ignored) {}
                      rootContainer = null;
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  showFloatingReactorHud();
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  removeBubble();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: 9. Upgrade MainActivity.java with Auto-Overlay Setup & Camera WebRTC Fix
        run: |
          cat << 'EOF' > android/app/src/main/java/com/nova/jarvis/MainActivity.java
          package com.nova.jarvis;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              private PowerManager.WakeLock wakeLock;
              private static boolean promptedOverlayOnce = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "NovaJarvis::BackgroundWakeLock");
                      wakeLock.acquire();
                  }

                  requestHardwarePermissions();
                  configureJarvisWebView();
                  autoEnsureOverlayAndStartService();
              }

              private void autoEnsureOverlayAndStartService() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      if (!promptedOverlayOnce) {
                          promptedOverlayOnce = true;
                          Toast.makeText(this, "Turn ON 'NOVA Jarvis AI' here to enable the Floating Jarvis HUD!", Toast.LENGTH_LONG).show();
                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivity(intent);
                      }
                      return;
                  }
                  startJarvisBackgroundService();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  attachCameraWebChromeClient();
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this)) {
                      startJarvisBackgroundService();
                  }
              }

              private void startJarvisBackgroundService() {
                  try {
                      Intent serviceIntent = new Intent(this, JarvisOverlayService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }
                  } catch (Exception ignored) {}
              }

              private void requestHardwarePermissions() {
                  List<String> perms = new ArrayList<>();
                  perms.add(Manifest.permission.CAMERA);
                  perms.add(Manifest.permission.RECORD_AUDIO);
                  perms.add(Manifest.permission.MODIFY_AUDIO_SETTINGS);
                  if (Build.VERSION.SDK_INT >= 33) {
                      perms.add("android.permission.POST_NOTIFICATIONS");
                  }
                  List<String> needed = new ArrayList<>();
                  for (String p : perms) {
                      if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {
                          needed.add(p);
                      }
                  }
                  if (!needed.isEmpty()) {
                      ActivityCompat.requestPermissions(this, needed.toArray(new String[0]), 1001);
                  }
              }

              private void attachCameraWebChromeClient() {
                  if (this.bridge == null || this.bridge.getWebView() == null) return;
                  WebView webView = this.bridge.getWebView();
                  webView.setWebChromeClient(new BridgeWebChromeClient(this.bridge) {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              try {
                                  request.grant(request.getResources());
                              } catch (Exception ignored) {}
                          });
                      }
                  });
              }

              private void configureJarvisWebView() {
                  if (this.bridge == null || this.bridge.getWebView() == null) return;
                  WebView webView = this.bridge.getWebView();
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  webView.addJavascriptInterface(new NovaNativeBridge(), "NovaAndroid");
                  attachCameraWebChromeClient();
              }

              public class NovaNativeBridge {
                  @JavascriptInterface
                  public boolean isAndroidApp() {
                      return true;
                  }

                  @JavascriptInterface
                  public String enableOverlayBubble() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(MainActivity.this)) {
                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                          return "OPENED_OVERLAY_SETTINGS";
                      }
                      startJarvisBackgroundService();
                      return "OVERLAY_ACTIVE";
                  }

                  @JavascriptInterface
                  public String openAccessibilitySettings() {
                      Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                      return "OPENED_ACCESSIBILITY_SETTINGS";
                  }

                  @JavascriptInterface
                  public boolean isUltronConnected() {
                      return UltronAccessibilityService.getInstance() != null;
                  }

                  @JavascriptInterface
                  public boolean globalAction(String action) {
                      UltronAccessibilityService svc = UltronAccessibilityService.getInstance();
                      if (svc == null) return false;
                      return svc.runGlobal(action);
                  }

                  @JavascriptInterface
                  public boolean tapScreen(float x, float y) {
                      UltronAccessibilityService svc = UltronAccessibilityService.getInstance();
                      if (svc == null) return false;
                      return svc.tapPoint(x, y);
                  }

                  @JavascriptInterface
                  public boolean swipeScreen(float x1, float y1, float x2, float y2, int durationMs) {
                      UltronAccessibilityService svc = UltronAccessibilityService.getInstance();
                      if (svc == null) return false;
                      return svc.swipePath(x1, y1, x2, y2, durationMs);
                  }

                  @JavascriptInterface
                  public boolean openApp(String appNameOrPkg) {
                      try {
                          String q = appNameOrPkg.toLowerCase().trim();
                          String pkg = q;
                          if (q.contains("whatsapp")) pkg = "com.whatsapp";
                          else if (q.contains("youtube")) pkg = "com.google.android.youtube";
                          else if (q.contains("chrome") || q.contains("browser")) pkg = "com.android.chrome";
                          else if (q.contains("instagram")) pkg = "com.instagram.android";
                          else if (q.contains("gmail") || q.contains("mail")) pkg = "com.google.android.gm";
                          else if (q.contains("maps")) pkg = "com.google.android.apps.maps";
                          else if (q.contains("settings")) {
                              Intent s = new Intent(Settings.ACTION_SETTINGS);
                              s.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(s);
                              return true;
                          } else if (q.contains("camera")) {
                              Intent c = new Intent("android.media.action.IMAGE_CAPTURE");
                              c.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(c);
                              return true;
                          }

                          Intent launch = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (launch != null) {
                              launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(launch);
                              return true;
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().onResume();
                      this.bridge.getWebView().resumeTimers();
                  }
              }

              @Override
              public void onDestroy() {
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: 10. Register Camera Features & Foreground Service Types in AndroidManifest.xml
        run: |
          python3 - << 'EOF'
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              xml = f.read()

          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.any" android:required="false" />
              <uses-feature android:name="android.hardware.camera.front" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
          """

          services = """
                  <service
                      android:name=".JarvisOverlayService"
                      android:enabled="true"
                      android:exported="false" />

                  <service
                      android:name=".UltronAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:label="NOVA Ultron Agent Control"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/ultron_accessibility" />
                  </service>
              </application>
          """

          if "<application" in xml:
              xml = xml.replace(
                  "<application",
                  permissions + '\n    <application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"',
                  1
              )

          if "</application>" in xml:
              xml = xml.replace("</application>", services, 1)

          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(xml)
          EOF

      - name: 11. Compile Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 12. Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Jarvis-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
